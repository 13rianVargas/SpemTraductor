<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpemTraductor V4</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="header-left">
            <img src="assets/img/SPEM Shield.png" alt="SPEM Shield logo" />
            <div class="header-text">
                <h1>SpemTraductor</h1>
                <span class="version-badge">V4</span>
            </div>
        </div>
    </header>

    <main>

        <section class="steps">
            <div class="step">
                <span class="step-number">1</span>
                <div class="step-content">
                    <h3>Escribe</h3>
                    <p>Ingresa texto en cualquiera de los dos campos</p>
                </div>
            </div>
            <div class="step">
                <span class="step-number">2</span>
                <div class="step-content">
                    <h3>Traduce</h3>
                    <p>La traducción aparece automáticamente en tiempo real</p>
                </div>
            </div>
            <div class="step">
                <span class="step-number">3</span>
                <div class="step-content">
                    <h3>Copia</h3>
                    <p>Un clic en el botón para copiar tu resultado</p>
                </div>
            </div>
        </section>

        <article class="txtas">
            <div class="field-group">
                <label for="original">Sin Encriptar</label>
                <textarea id="original" placeholder="Ejemplo: Clan Spem" oninput="encrypt()"></textarea>
                <button class="copy-btn" onclick="copyOriginal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copiar
                </button>
            </div>

            <div class="arrow-separator">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 16l-4-4 4-4"/>
                    <path d="M17 8l4 4-4 4"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                </svg>
            </div>

            <div class="field-group">
                <label for="encrypted">Encriptado</label>
                <textarea id="encrypted" placeholder="3k342no: Dnaq 1234" oninput="decrypt()"></textarea>
                <button class="copy-btn" onclick="copyEncrypted()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copiar
                </button>
            </div>
        </article>

        <section class="clear">
            <button class="clear-btn" onclick="clearTextareas()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                Limpiar campos
            </button>
        </section>

    </main>

    <footer>
        <p>© 2026 SpemTraductor · Creado por <a href="https://linktr.ee/13rianVargas">13rian Vargas</a> · <a href="https://github.com/13rianVargas/SpemTraductor">Contribuir</a></p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
